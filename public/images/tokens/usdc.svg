<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="40" fill="#2775CA"/>
  <!-- Arc ring: large arc over top + small arc at bottom, gaps at lower corners -->
  <!-- Circumference r=66 ≈ 415. Large arc 278°≈320, small arc 52°≈60, gaps 17.5≈18 each -->
  <circle cx="100" cy="100" r="66" fill="none" stroke="white" stroke-width="17"
    stroke-linecap="round"
    stroke-dasharray="320 18 59 18"
    transform="rotate(143 100 100)"/>
  <!-- Dollar sign vertical bar -->
  <rect x="93" y="42" width="14" height="116" rx="7" fill="white"/>
  <!-- Dollar sign S-curve (upper half curves left, lower half curves right) -->
  <path stroke="white" stroke-width="13" stroke-linecap="round" fill="none"
    d="M 126,76 C 126,64 112,58 100,58 C 88,58 72,64 72,78 C 72,92 88,97 100,100
       C 112,103 130,108 130,122 C 130,136 114,143 100,143 C 86,143 72,136 72,124"/>
</svg>
